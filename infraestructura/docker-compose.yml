  # ---------------------------------------------------------------
  # OPCIONAL — Trivias/repasos gamificados (Razzia o QuizLive)
  # Aislamiento: código de sesión temporal por partida, sin
  # configuración adicional necesaria.
  # Requieren construir la imagen desde el repositorio:
  #   Razzia:   https://github.com/Ralex91/Razzia
  #   QuizLive: https://github.com/sivasooryagiri/quizlive
  # ---------------------------------------------------------------

  # ---------------------------------------------------------------
  # OPCIONAL — LMS (LearnHouse o Frappe LMS)
  # Es la ÚNICA herramienta con concepto nativo de "curso" e
  # inscripción de estudiantes — aislamiento real, no improvisado.
  # Evaluar si el resto de mecanismos (rooms/eventos/boards) no te
  # da suficiente garantía de separación.
  # ---------------------------------------------------------------
