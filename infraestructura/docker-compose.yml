  #   image: postgres:15-alpine
  #   container_name: hedgedoc-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_PASSWORD: ${HEDGEDOC_DB_PASSWORD}
  #     POSTGRES_USER: hedgedoc
  #     POSTGRES_DB: hedgedoc
  #   volumes:
  #     - hedgedoc_db:/var/lib/postgresql/data
  #   networks:
  #     - curso-net
  #
